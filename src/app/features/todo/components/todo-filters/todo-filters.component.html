<div class="glass rounded-2xl p-1 mt-2 shadow-task flex items-center gap-2">
  <!-- Segment control -->
  <div class="flex flex-1 bg-surface-100/60 dark:bg-white/5 rounded-xl p-1 gap-1">
    @for (status of filterOptions; track status) {
      <button
        (click)="setStatusFilter(status)"
        class="flex-1 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200"
        [class.bg-white]="todoService.filter().status === status"
        [class.dark:bg-white/15]="todoService.filter().status === status"
        [class.text-primary-600]="todoService.filter().status === status"
        [class.dark:text-primary-400]="todoService.filter().status === status"
        [class.shadow-sm]="todoService.filter().status === status"
        [class.text-surface-500]="todoService.filter().status !== status"
        [class.dark:text-surface-500]="todoService.filter().status !== status"
      >
        {{ 'filter.' + status | translate }}
      </button>
    }
  </div>

  <!-- Divider -->
  <div class="w-px h-6 bg-surface-200 dark:bg-white/10 shrink-0"></div>

  <!-- Sort field -->
  <select
    (change)="onSortByChange($event)"
    [value]="todoService.filter().sortBy"
    class="text-xs font-medium bg-transparent outline-none cursor-pointer text-surface-500 dark:text-surface-400 pr-1"
  >
    <option value="createdAt">{{ 'filter.date' | translate }}</option>
    <option value="priority">{{ 'filter.priority' | translate }}</option>
    <option value="dueDate">{{ 'filter.due_date' | translate }}</option>
  </select>

  <!-- Sort order -->
  <button
    (click)="onSortOrderChange()"
    class="p-1.5 rounded-lg hover:bg-white/50 dark:hover:bg-white/10 transition-colors duration-200 shrink-0"
    [attr.aria-label]="'filter.sort_by' | translate"
  >
    <i-lucide
      [name]="todoService.filter().sortOrder === 'asc' ? 'chevron-up' : 'chevron-down'"
      class="w-4 h-4"
    ></i-lucide>
  </button>
</div>
