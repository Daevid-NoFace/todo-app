<div class="space-y-6">
  <app-todo-form (todoCreated)="onTodoCreated($event)" />

  <div class="flex items-center justify-between text-sm pt-2 text-surface-500 dark:text-surface-400">
    <span>
      {{ todoService.activeCount() === 1
      ? ('todo.item_left' | translate: { count: todoService.activeCount() })
      : ('todo.items_left' | translate: { count: todoService.activeCount() }) }}
    </span>
    @if (todoService.completedCount() > 0) {
      <button (click)="todoService.clearCompleted()" class="hover:text-red-500 transition-colors duration-200">
        {{ 'todo.clear_completed' | translate }}
      </button>
    }
  </div>

  <app-todo-list
    [todos]="todoService.filteredTodos()"
    (toggled)="onTodoToggled($event)"
    (deleted)="onTodoDeleted($event)"
    (edited)="onTodoEdited($event)" />
</div>
