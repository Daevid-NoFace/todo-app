<header
  class="sticky top-0 z-10 bg-white/80 dark:bg-[#0D0F1A]/80 backdrop-blur-xl border-b border-border-glass dark:border-border-glass-dark">
  <div class="px-4 py-3 flex items-center justify-between gap-3">
    <!-- Logo + Title -->
    <a (click)="goHome()" class="flex items-center gap-2.5">
      <div
        class="w-8 h-8 rounded-xl bg-linear-to-br from-primary-500 to-accent-pink flex items-center justify-center shadow-fab shrink-0">
        <i-lucide name="check" [size]="16" class="text-white" />
      </div>
      <h1 class="text-lg font-bold bg-linear-to-r from-primary-500 to-accent-pink bg-clip-text text-transparent">
        {{ 'app.title' | translate }}
      </h1>
    </a>

    <!-- Right actions -->
    <div class="flex items-center gap-1">
      <!-- Theme toggle -->
      <app-theme-toggle variant="icon-only"></app-theme-toggle>

      <!-- Language toggle -->
      <button (click)="switchLanguage()"
        class="px-2.5 py-1.5 rounded-xl text-xs font-semibold text-surface-500 dark:text-surface-400 hover:bg-surface-100 dark:hover:bg-white/10 transition-colors duration-200">
        {{ i18n.currentLang() === 'en' ? 'PT' : 'EN' }}
      </button>
    </div>
  </div>
</header>
