<div class="flex items-center justify-between">
    <!-- Title -->
    <p [class]="
      variant() === 'sidebar'
        ? 'text-xs font-semibold text-surface-600 dark:text-surface-300'
        : 'text-base font-semibold text-surface-800 dark:text-surface-100'
    ">
        {{ editingProject() ? ('project.edit' | translate) : ('project.new' | translate) }}
    </p>

    <!-- Cancel X button -->
    <button (click)="onCancel()" [class]="
      variant() === 'sidebar'
        ? 'p-1 rounded-lg hover:bg-surface-100 dark:hover:bg-white/10 transition-colors duration-200'
        : 'p-1.5 rounded-lg hover:bg-surface-100 dark:hover:bg-white/10 transition-colors duration-200'
    ">
        <i-lucide name="x" [size]="variant() === 'sidebar' ? 16 : 18" class="text-surface-400"></i-lucide>
    </button>
</div>

<!-- Name input -->
<input #nameRef type="text" [placeholder]="'project.name_placeholder' | translate" [value]="name()"
    (input)="name.set(nameRef.value)" (keydown.enter)="onSave()" (keydown.escape)="onCancel()" [class]="
    variant() === 'sidebar'
      ? 'w-full px-3 py-2 mt-2 rounded-lg text-sm bg-white/50 dark:bg-white/5 border border-surface-200/60 dark:border-white/10 outline-none focus:border-primary-500 text-surface-900 dark:text-surface-100 placeholder-surface-400 dark:placeholder-surface-500'
      : 'w-full px-4 py-3 mt-2 rounded-xl text-sm bg-white/50 dark:bg-white/5 border border-surface-200/60 dark:border-white/10 outline-none focus:border-primary-500 text-surface-900 dark:text-surface-100 placeholder-surface-400'
  " />

<!-- Color picker -->
<div class="flex gap-1.5 flex-wrap justify-between mt-2">
    @for (c of projectColors; track c) {
    <button type="button" (click)="color.set(c)" [style.background-color]="c" [class.ring-2]="color() === c"
        [class.white]="theme.darkMode() && color() === c" [class.ring-primary-500]="color() === c && !theme.darkMode()"
        [class]="
        variant() === 'sidebar'
          ? 'w-5 h-5 rounded-full transition-all duration-200 ring-offset-1'
          : 'w-8 h-8 rounded-full transition-all duration-200 ring-offset-2'
      "></button>
    }
</div>

<!-- Icon picker -->
<div class="flex gap-1.5 justify-between mt-2">
    @for (i of projectIcons; track i) {
    <button type="button" (click)="icon.set(i)" [class.bg-primary-500]="icon() === i"
        [class.bg-surface-100]="icon() !== i" [class.dark:bg-white/10]="icon() !== i" [class]="
        variant() === 'sidebar'
          ? 'w-7 h-7 rounded-lg flex items-center justify-center transition-all duration-200'
          : 'w-10 h-10 rounded-xl flex items-center justify-center transition-all duration-200'
      ">
        <i-lucide [name]="i" [size]="variant() === 'sidebar' ? 14 : 18" [class.text-white]="icon() === i"
            [class.text-surface-500]="icon() !== i"></i-lucide>
    </button>
    }
</div>

<!-- Actions -->
<div class="flex gap-2 mt-2" [class.pt-1]="variant() === 'sheet'">
    <button (click)="onSave()" [class]="
      variant() === 'sidebar'
        ? 'flex-1 py-1.5 rounded-lg text-xs font-semibold bg-primary-500 hover:bg-primary-600 text-white transition-colors duration-200'
        : 'flex-1 py-3 rounded-xl text-sm font-semibold bg-primary-500 hover:bg-primary-600 text-white shadow-fab transition-all duration-200'
    ">
        {{ editingProject() ? ('project.save' | translate) : ('project.create' | translate) }}
    </button>

    @if (editingProject()) {
    <button (click)="onDelete()" [class]="
        variant() === 'sidebar'
          ? 'p-1.5 rounded-lg hover:bg-red-500/10 transition-colors duration-200'
          : 'px-4 py-3 rounded-xl hover:bg-red-500/10 transition-colors duration-200'
      ">
        <i-lucide name="trash-2" [size]="variant() === 'sidebar' ? 16 : 18" class="text-red-500"></i-lucide>
    </button>
    }
</div>
