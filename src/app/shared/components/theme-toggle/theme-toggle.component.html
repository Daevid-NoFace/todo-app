@switch (variant()) {

@case ('icon-only') {
<button (click)="theme.toggle()" class="w-9 h-9 flex items-center justify-center rounded-xl hover:bg-surface-100 dark:hover:bg-white/10
  transition-colors duration-200"
    [attr.aria-label]="theme.darkMode() ? ('theme.light' | translate) : ('theme.dark' | translate)">
    @if (theme.darkMode()) {
    <i-lucide name="sun" [size]="18" class="text-accent-amber" />
    } @else {
    <i-lucide name="moon" [size]="18" class="text-primary-400" />
    }
</button>
}

@case ('icon-label') {
<button (click)="theme.toggle()" class="flex items-center gap-2 px-3 py-2 rounded-xl text-sm transition-all duration-200 hover:bg-white/50
   dark:hover:bg-white/10 flex-1">
    @if (theme.darkMode()) {
    <i-lucide name="sun" class="w-4 h-4 text-accent-amber" />
    } @else {
    <i-lucide name="moon" class="w-4 h-4 text-primary-400" />
    }
</button>
}

@case ('row') {
<button (click)="theme.toggle()" class="w-full flex items-center justify-between px-4 py-3.5 hover:bg-white/40 dark:hover:bg-white/5
  border-b border-border-glass dark:border-border-glass-dark transition-colors duration-200">
    <div class="flex items-center gap-3">
        @if (theme.darkMode()) {
        <i-lucide name="sun" [size]="18" class="text-accent-amber" />
        } @else {
        <i-lucide name="moon" [size]="18" class="text-primary-400" />
        }
        <span class="text-sm font-medium text-surface-700 dark:text-surface-300">
            {{ theme.darkMode() ? ('profile.light_mode' | translate) : ('profile.dark_mode' | translate) }}
        </span>
    </div>
    <i-lucide name="chevron-right" [size]="16" class="text-surface-400" />
</button>
}

}
