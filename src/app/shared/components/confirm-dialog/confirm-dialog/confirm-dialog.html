<div class="fixed inset-0 z-50 flex items-center justify-center p-4"
    (click)="cancelled.emit()">

    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
    <div class="relative bg-white dark:bg-surface-900 rounded-xl border border-surface-200 dark:border-surface-800 shadow-xl max-w-sm w-full p-6 space-y-4"
        (click)="$event.stopPropagation()">
        <p class="text-surface-900 dark:text-surface-100 font-medium">
            {{ message() }}
        </p>
        <div class="flex justify-end gap-3">
            <button (click)="onCancel()" 
                    class="px-4 py-2 rounded-lg text-sm font-medium text-surface-600 dark:text-surface-400 hover:bg-surface-100 dark:hover:bg-surface-800 transition-colors duration-200">
                {{ 'dialog.cancel' | translate }}
            </button>
            <button (click)="onConfirm()"
                    class="px-4 py-2 rounded-lg text-sm font-medium bg-red-600 hover:bg-red-500 text-white transition-colors duration-200">
                {{ 'dialog.confirm' | translate }}
            </button>
        </div>
    </div>
</div>
