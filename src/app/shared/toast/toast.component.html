<div class="fixed top-4 right-4 left-4 sm:top-auto sm:bottom-4 sm:left-auto z-50 flex flex-col gap-2 sm:min-w-80 sm:max-w-96">
    @for (toast of toastService.toasts(); track toast.id) {
    <div @fadeSlideIn class="flex items-center justify-between gap-3 px-4 py-3 rounded-lg shadow-lg border text-sm" [class]="typeClasses(toast.type)">
        <span>{{ toast.message }}</span>
        <div class="flex items-center gap-2 shrink-0">
            @if (toast.action) {
            <button (click)="toast.action.callback(); toastService.dismiss(toast.id)" class="font-medium underline underline-offset-2 hover:opacity-80 transition-opacity">
                {{ toast.action.label }}
            </button>
            }
            <button (click)="toastService.dismiss(toast.id)" aria-label="Dismiss"
                class="hover:opacity-80 transition-opacity">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
        </div>
    </div>
    }
</div>
